[project]
name = "live-trader"
version = "0.1.0"
description = "QuantumSignals algorithmic trading bot with pluggable brokers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "quantumsignals-client>=0.6.0",
    # Broker packages (workspace members). Each owns its own broker SDK
    # (e.g. alpaca-py) and registers a "qs_trader_brokers" entry point that
    # trader.brokers.create_broker discovers at runtime.
    "qs-trader-broker-core",
    "qs-trader-broker-alpaca",
]

[project.scripts]
live-trader = "trader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.uv.workspace]
members = ["src/brokers/*"]

[tool.uv.sources]
qs-trader-broker-core = { workspace = true }
qs-trader-broker-alpaca = { workspace = true }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0",
]
