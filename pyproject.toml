[project]
name = "live-trader"
version = "0.1.0"
description = "QuantumSignals algorithmic trading bot (IBKR + Alpaca)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.29.0",
    "ib-async>=2.0.0",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "quantumsignals-client>=0.4.0",
]

[project.scripts]
live-trader = "trader.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=8.0",
]
