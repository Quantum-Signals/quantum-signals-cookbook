services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-trader:latest
    container_name: live-trader

    env_file:
      - .env

    volumes:
      # Persist daily log files on the host
      - ./logs:/app/logs

    restart: unless-stopped
    # Time to close positions on `docker compose stop` (Docker allows 10 s by default).
    stop_grace_period: 3m
