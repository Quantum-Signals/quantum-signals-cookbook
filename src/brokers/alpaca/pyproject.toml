[project]
name = "qs-trader-broker-alpaca"
version = "0.1.0"
description = "Alpaca broker (REST, equities/ETFs) for the QuantumSignals live trader"
requires-python = ">=3.12"
dependencies = [
    "qs-trader-broker-core",
    "alpaca-py>=0.29.0",
    "loguru>=0.7.3",
]

[project.entry-points.qs_trader_brokers]
alpaca = "qs_trader_broker_alpaca:AlpacaBroker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_trader_broker_alpaca"]

[tool.uv.sources]
qs-trader-broker-core = { workspace = true }
