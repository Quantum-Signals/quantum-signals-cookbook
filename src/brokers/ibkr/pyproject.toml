[project]
name = "qs-trader-broker-ibkr"
version = "0.1.0"
description = "Interactive Brokers broker (ib_async, futures + equities) for the QuantumSignals live trader"
requires-python = ">=3.12"
dependencies = [
    "qs-trader-broker-core",
    "ib-async>=2.0.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.0",
]

[project.entry-points.qs_trader_brokers]
ibkr = "qs_trader_broker_ibkr:IBBroker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_trader_broker_ibkr"]

[tool.uv.sources]
qs-trader-broker-core = { workspace = true }
