[project]
name = "qs-trader-broker-core"
version = "0.1.0"
description = "Shared broker interface (BrokerBase, OrderResult, BrokerSettings) and the simulated broker for the QuantumSignals live trader"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
]

# The always-available simulated broker registers itself the same way an
# external broker package would.
[project.entry-points.qs_trader_brokers]
simulated = "qs_trader_broker_core.simulated:SimulatedBroker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qs_trader_broker_core"]
